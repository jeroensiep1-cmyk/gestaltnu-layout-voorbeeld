<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>Wis service worker — Gestalt Nu</title>
</head>
<body style="font-family: system-ui; max-width: 40rem; margin: 2rem auto; background:#f6eedf; color:#2a231c;">
  <h1>Service worker wissen</h1>
  <p id="status">Bezig…</p>
  <script>
    (async function () {
      var status = document.getElementById("status");
      try {
        if ("serviceWorker" in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations();
          for (var i = 0; i < regs.length; i++) await regs[i].unregister();
          status.textContent = "Service workers: " + regs.length + " verwijderd.";
        } else {
          status.textContent = "Geen service worker API.";
        }
        if (window.caches) {
          var keys = await caches.keys();
          for (var j = 0; j < keys.length; j++) await caches.delete(keys[j]);
          status.textContent += " Caches: " + keys.length + " gewist.";
        }
      } catch (e) {
        status.textContent = "Fout: " + e;
      }
      status.innerHTML +=
        '<p><a href="http://127.0.0.1:8765/site/backups/index-LATEST-2026-11-05.html">Open nu de goedgekeurde homepage</a></p>';
    })();
  </script>
</body>
</html>
