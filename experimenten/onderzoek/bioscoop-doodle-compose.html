<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; padding: 0; background: #f6eedf; }
    .stage {
      width: 3200px;
      height: 1800px;
      position: relative;
      overflow: hidden;
      background: #f6eedf;
    }
    .enso {
      position: absolute;
      left: 80px; top: 80px;
      width: 2200px; height: 1600px;
      border: 28px solid #0f6e6e;
      border-radius: 50%;
      opacity: 0.85;
      box-sizing: border-box;
      pointer-events: none;
    }
    .zaal {
      position: absolute;
      left: 120px; top: 200px;
      width: 1900px; height: 1400px;
      background: #3a2f24;
      opacity: 0.55;
      border-radius: 80px;
    }
    .scherm {
      position: absolute;
      left: 420px; top: 220px;
      width: 1200px; height: 520px;
      background: #1f1914;
      border: 14px solid #3a2f24;
      border-radius: 36px;
      overflow: hidden;
    }
    .scherm-inner {
      margin: 24px;
      height: calc(100% - 48px);
      display: flex;
      gap: 28px;
      align-items: center;
      justify-content: space-around;
      color: #3a2f24;
      font-family: Georgia, serif;
    }
    .paneel {
      width: 320px; height: 400px;
      border: 10px solid #3a2f24;
      border-radius: 28px;
      background: #f6eedf;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }
    .masker {
      width: 140px; height: 150px;
      background: #f2b8a0;
      border: 10px solid #3a2f24;
      border-radius: 50%;
      position: relative;
    }
    .masker.teal { background: #0f6e6e; }
    .oog {
      width: 14px; height: 14px;
      background: #3a2f24;
      border-radius: 50%;
      position: absolute;
      top: 58px;
    }
    .oog.l { left: 38px; }
    .oog.r { right: 38px; }
    .oog.w { background: #f6eedf; }
    .mond {
      position: absolute;
      left: 40px; right: 40px; bottom: 42px;
      height: 18px;
      border-bottom: 8px solid #3a2f24;
      border-radius: 0 0 40px 40px;
    }
    .bliksem {
      width: 0; height: 0;
      border-left: 40px solid transparent;
      border-right: 40px solid transparent;
      border-top: 120px solid #e8b84a;
      filter: drop-shadow(0 0 0 #3a2f24);
      position: relative;
    }
    .bliksem:after {
      content: "";
      position: absolute;
      left: -28px; top: 70px;
      width: 70px; height: 90px;
      background: #e8b84a;
      clip-path: polygon(55% 0, 20% 55%, 50% 55%, 30% 100%, 85% 40%, 55% 40%);
      border: 0;
    }
    .hart {
      width: 70px; height: 64px;
      background: #c45c3e;
      border: 8px solid #3a2f24;
      border-radius: 70px 70px 8px 8px;
      transform: rotate(-45deg);
      margin-top: 20px;
    }
    .muur {
      width: 160px; height: 180px;
      background: #d8c8a8;
      border: 10px solid #3a2f24;
      border-radius: 12px;
      background-image:
        linear-gradient(#3a2f24 4px, transparent 4px),
        linear-gradient(90deg, #3a2f24 4px, transparent 4px);
      background-size: 100% 45px, 80px 100%;
      opacity: 0.95;
    }
    .ketting {
      display: flex; flex-direction: column; gap: 4px; align-items: center;
    }
    .schakel {
      width: 48px; height: 28px;
      border: 8px solid #3a2f24;
      border-radius: 20px;
      background: transparent;
    }
    .stoelrij {
      position: absolute;
      display: flex; gap: 28px;
    }
    .stoel {
      width: 160px; height: 120px;
      background: #0f6e6e;
      border: 10px solid #3a2f24;
      border-radius: 28px 28px 12px 12px;
    }
    .stoel:before {
      content: "";
      display: block;
      height: 44px;
      margin: 10px 14px 0;
      background: #0b5555;
      border: 8px solid #3a2f24;
      border-radius: 18px 18px 8px 8px;
    }
    .rij1 { left: 280px; top: 780px; }
    .rij2 { left: 200px; top: 940px; }
    .hoofdstoel {
      position: absolute;
      left: 820px; top: 1080px;
      width: 520px; height: 280px;
      background: #0f6e6e;
      border: 14px solid #3a2f24;
      border-radius: 60px 60px 24px 24px;
      z-index: 4;
    }
    .hoofdstoel:before {
      content: "";
      position: absolute;
      left: 40px; right: 40px; top: -120px;
      height: 160px;
      background: #0b5555;
      border: 14px solid #3a2f24;
      border-radius: 40px 40px 16px 16px;
    }
    .deur {
      position: absolute;
      right: 80px; top: 140px;
      width: 720px; height: 1500px;
      background: #e8f0d8;
      border: 14px solid #3a2f24;
      border-radius: 28px;
      overflow: hidden;
    }
    .zon {
      position: absolute;
      right: 120px; top: 80px;
      width: 180px; height: 180px;
      background: #e8b84a;
      border: 12px solid #3a2f24;
      border-radius: 50%;
    }
    .gras {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 55%;
      background: #7ea86a;
      border-top: 10px solid #3a2f24;
    }
    .heuvel {
      position: absolute;
      left: -40px; right: -40px; bottom: 38%;
      height: 220px;
      background: #b9c8a4;
      border: 10px solid #3a2f24;
      border-radius: 50% 50% 0 0;
    }
    .plant {
      position: absolute;
      left: 40px; bottom: 40px;
      width: 420px; height: 520px;
    }
    .plant img { width: 100%; height: 100%; object-fit: contain; }
    .deurvleugel {
      position: absolute;
      right: -20px; top: 0;
      width: 160px; height: 100%;
      background: #0f6e6e;
      border: 12px solid #3a2f24;
      border-radius: 12px;
      transform: perspective(400px) rotateY(-28deg);
      transform-origin: left center;
    }
    .sitter {
      position: absolute;
      left: 760px; top: 720px;
      width: 820px; height: 820px;
      z-index: 5;
    }
    .sitter img { width: 100%; height: 100%; object-fit: contain; }
    .bloem {
      position: absolute;
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 6px solid #3a2f24;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="zaal"></div>

    <div class="scherm">
      <div class="scherm-inner">
        <div class="paneel" aria-label="maskers">
          <div class="masker">
            <span class="oog l"></span><span class="oog r"></span>
            <span class="mond"></span>
          </div>
          <div class="masker teal">
            <span class="oog l w"></span><span class="oog r w"></span>
          </div>
        </div>
        <div class="paneel" aria-label="triggers">
          <svg width="120" height="160" viewBox="0 0 80 110">
            <path d="M45 5 L25 55 H45 L18 105 L70 50 H48 Z" fill="#e8b84a" stroke="#3a2f24" stroke-width="6" stroke-linejoin="round"/>
          </svg>
          <svg width="90" height="80" viewBox="0 0 90 80">
            <path d="M20 35c0-16 14-24 28-12 14-12 28-4 28 12 0 20-28 38-28 38s-28-18-28-38z" fill="#c45c3e" stroke="#3a2f24" stroke-width="6" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="paneel" aria-label="belemmeringen">
          <div class="muur"></div>
          <div class="ketting">
            <div class="schakel"></div>
            <div class="schakel"></div>
            <div class="schakel"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="stoelrij rij1">
      <div class="stoel"></div><div class="stoel"></div><div class="stoel"></div><div class="stoel"></div>
    </div>
    <div class="stoelrij rij2">
      <div class="stoel"></div><div class="stoel"></div><div class="stoel"></div>
    </div>
    <div class="hoofdstoel" aria-hidden="true"></div>

    <div class="deur">
      <div class="zon"></div>
      <div class="heuvel"></div>
      <div class="gras"></div>
      <div class="plant"><img src="plant-gn.svg" alt="" /></div>
      <div class="bloem" style="left:420px;bottom:180px;background:#c45c3e"></div>
      <div class="bloem" style="left:520px;bottom:140px;background:#e8b84a"></div>
      <div class="deurvleugel"></div>
    </div>

    <div class="sitter">
      <img src="sitting-gn.svg" alt="zittend poppetje" />
    </div>
  </div>
</body>
</html>
