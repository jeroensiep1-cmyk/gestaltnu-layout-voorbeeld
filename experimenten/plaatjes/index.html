<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Plaatjes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Outfit:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --ink: #231e1a;
        --muted: #5e564c;
        --paper: #fff;
        --serif: Fraunces, Palatino, Georgia, serif;
        --sans: Outfit, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
        line-height: 1.5;
      }
      .wrap { width: min(920px, calc(100% - 4rem)); margin: 0 auto; padding: 4.5rem 0 6rem; }
      a.terug { color: inherit; }
      h1 {
        font-family: var(--serif);
        font-weight: 560;
        letter-spacing: -0.04em;
        line-height: 0.98;
        font-size: clamp(2.6rem, 6vw, 4.4rem);
        margin: 0.6rem 0 0.6rem;
      }
      .inleiding { max-width: 46ch; color: var(--muted); }
      figure {
        margin: 2.2rem 0 0;
        background: #fff;
        border-radius: 1.2rem;
        overflow: hidden;
      }
      figure a { display: block; }
      img, figure svg, figure object {
        width: 100%;
        height: auto;
        display: block;
        background: #fff;
      }
      figcaption {
        padding: 0.8rem 1.1rem 1.1rem;
        color: var(--muted);
      }
      figcaption strong {
        display: block;
        color: var(--ink);
        font-family: var(--serif);
        font-size: 1.6rem;
        font-weight: 560;
        letter-spacing: -0.03em;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <a class="terug" href="../index.html">Terug naar het overzicht</a>
      <h1>Plaatjes, groot.</h1>
      <p class="inleiding">
        Klik op een plaatje. Dan vult het het scherm, net als een website.
        Bovenaan staat de donkere kamer, om het echte poppetje heen.
      </p>

      <figure>
        <a href="../vorm/deur-donker.html">
          <img src="../vorm/deur-poppetje.png" alt="Een poppetje legt een hand op een deur. De zon schijnt door de kier." />
        </a>
        <figcaption>
          <strong>De deur, met het echte poppetje</strong>
          Zijn tekening, zijn arm al uitgestoken. De kamer staat eromheen.
        </figcaption>
      </figure>

      <figure>
        <a href="../vorm/deur-doodle.jpg">
          <img src="../vorm/deur-doodle.jpg" alt="Iemand met een glimlach legt een hand op een deur. De zon schijnt door de kier." />
        </a>
        <figcaption>
          <strong>De deur, lichte kamer</strong>
          De tekening van de hoofdpagina.
        </figcaption>
      </figure>

      <figure>
        <a href="../vorm/deur-zon.jpg">
          <img src="../vorm/deur-zon.jpg" alt="Iemand in een donkere kamer reikt naar een deur waar de zon doorheen schijnt." />
        </a>
        <figcaption>
          <strong>De deur, donkere kamer</strong>
          Dezelfde scène, met de zon alleen door de kier.
        </figcaption>
      </figure>

      <figure>
        <a href="../vorm/doodles/strolling.svg">
          <img src="../vorm/doodles/strolling.svg" alt="Het wandelende poppetje van Open Doodles." />
        </a>
        <figcaption>
          <strong>Wandelen</strong>
          Een echt poppetje van de site die je koos.
        </figcaption>
      </figure>

      <figure>
        <a href="../vorm/doodles/running.svg">
          <img src="../vorm/doodles/running.svg" alt="Het rennende poppetje van Open Doodles." />
        </a>
        <figcaption>
          <strong>Rennen</strong>
          Dezelfde hand, andere houding.
        </figcaption>
      </figure>

      <figure>
        <a href="../vorm/doodles/sprinting.svg">
          <img src="../vorm/doodles/sprinting.svg" alt="Het sprintende poppetje van Open Doodles." />
        </a>
        <figcaption>
          <strong>Sprinten</strong>
        </figcaption>
      </figure>

      <figure>
        <a href="../vorm/doodles/plant.svg">
          <img src="../vorm/doodles/plant.svg" alt="Het poppetje met een plant van Open Doodles." />
        </a>
        <figcaption>
          <strong>De plant</strong>
        </figcaption>
      </figure>

      <figure>
        <a href="../vorm/doodles/sitting.svg">
          <img src="../vorm/doodles/sitting.svg" alt="Het zittende poppetje van Open Doodles." />
        </a>
        <figcaption>
          <strong>Zitten</strong>
        </figcaption>
      </figure>

      <figure>
        <a href="../vorm/doodles/coffee.svg">
          <img src="../vorm/doodles/coffee.svg" alt="Het poppetje met koffie van Open Doodles." />
        </a>
        <figcaption>
          <strong>Koffie</strong>
        </figcaption>
      </figure>

      <figure>
        <a href="../vorm/doodles/meditating.svg">
          <img src="../vorm/doodles/meditating.svg" alt="Het mediterende poppetje van Open Doodles." />
        </a>
        <figcaption>
          <strong>Stilzitten</strong>
        </figcaption>
      </figure>

      <figure>
        <a href="../vorm/doodles/reading.svg">
          <img src="../vorm/doodles/reading.svg" alt="Het lezende poppetje van Open Doodles." />
        </a>
        <figcaption>
          <strong>Lezen</strong>
        </figcaption>
      </figure>

      <figure>
        <a href="../vorm/doodles/loving.svg">
          <img src="../vorm/doodles/loving.svg" alt="Twee poppetjes van Open Doodles bij elkaar." />
        </a>
        <figcaption>
          <strong>Samen</strong>
        </figcaption>
      </figure>

      <figure>
        <a href="../vorm/doodles/chilling.svg">
          <img src="../vorm/doodles/chilling.svg" alt="Het luie poppetje van Open Doodles." />
        </a>
        <figcaption>
          <strong>Liggen</strong>
        </figcaption>
      </figure>
    </main>
  </body>
</html>
