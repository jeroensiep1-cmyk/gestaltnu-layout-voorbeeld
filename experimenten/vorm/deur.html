<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>De deur staat op een kier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Outfit:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --ink: #2a2622;
        --muted: #5c564e;
        --paper: #f6f1e6;
        --serif: Fraunces, Palatino, Georgia, serif;
        --sans: Outfit, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
        line-height: 1.5;
      }
      main {
        width: min(980px, calc(100% - 2.4rem));
        margin: 0 auto;
        padding: 2.2rem 0 3.2rem;
      }
      .merk {
        margin: 0 0 1.6rem;
        font-size: 0.95rem;
        letter-spacing: 0.01em;
      }
      h1 {
        font-family: var(--serif);
        font-weight: 560;
        font-size: clamp(2.4rem, 6vw, 4.2rem);
        letter-spacing: -0.03em;
        line-height: 1.02;
        margin: 0 0 0.7rem;
        max-width: 14ch;
      }
      p {
        margin: 0 0 1.4rem;
        max-width: 38ch;
        font-size: 1.15rem;
        color: var(--muted);
      }
      img {
        width: 100%;
        height: auto;
        display: block;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="merk">Gestalt Nu</p>
      <h1>De deur staat op een kier.</h1>
      <p>De zon schijnt al naar binnen. Trek hem open, en maak het leven zo mooi als jij wilt.</p>
      <img src="deur-doodle.jpg" alt="Iemand legt een hand op een deur die op een kier staat. Er schijnt zon doorheen, en een plant leunt naar binnen." />
    </main>
  </body>
</html>
