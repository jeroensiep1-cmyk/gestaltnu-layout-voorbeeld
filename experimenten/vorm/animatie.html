    <title>Rotterdam, in de poster</title>
    <style>
      html,
      body {
        margin: 0;
        background: #fff;
        color: #243044;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      svg {
        width: min(560px, 100vw);
        height: auto;
        display: block;
      }
      .wolken {
        animation: drijf 48s ease-in-out infinite alternate;
      }
      .boot {
        animation: vaar 36s linear infinite;
      }
      .optocht {
        animation: langs 32s linear infinite;
      }
      .been {
        transform-box: fill-box;
        transform-origin: center top;
        animation: stap 1.15s linear infinite alternate;
      }
      .been.b {
        animation-delay: -1.15s;
      }
      @keyframes drijf {
        from { transform: translateX(0); }
        to { transform: translateX(28px); }
      }
      @keyframes vaar {
        from { transform: translateX(-160px); }
        to { transform: translateX(980px); }
      }
      @keyframes langs {
        from { transform: translateX(-150px); }
        to { transform: translateX(920px); }
      }
      @keyframes stap {
        from { transform: rotate(14deg); }
        to { transform: rotate(-14deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .wolken,
        .boot,
        .optocht,
        .been {
          animation: none;
        }
        .optocht { transform: translateX(250px); }
        .boot { transform: translateX(40px); }
      }
    </style>
  </head>
